[package]
name = "flashcard"
version = "0.1.0"
description = "flashcard — 플래시카드 덱 에디터"
authors = ["flashcard"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flashcard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
# 스킬 사본을 바이너리에 넣는다 — 실행 시점에 vendor/ 를 찾지 않는다
include_dir = "0.7"
# 창 크기·위치를 재시작 사이에 기억한다
tauri-plugin-window-state = "2"
# .apkg 는 zip — 안의 sqlite 컬렉션과 media 목록을 꺼낸다 (Anki 는 deflate 만 쓴다)
zip = { version = "2", default-features = false, features = ["deflate"] }
# Anki 컬렉션은 sqlite. bundled 로 시스템 sqlite 버전에 기대지 않는다
rusqlite = { version = "0.32", features = ["bundled"] }
# 최신 Anki(23.10+) 는 컬렉션·media 목록·미디어 파일을 zstd 로 감싼다
zstd = "0.13"
